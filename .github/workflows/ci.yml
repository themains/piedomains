name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly: surface ecosystem drift on quiet repos

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: gojiplus/py-canon/.github/workflows/reusable-ci.yml@v1
    with:
      wheel-import: piedomains
      coverage-floor: 0
      # TensorFlow ships no cp314 wheels, so the standard 3.11 + 3.14 matrix is
      # not reachable yet. Restore it once torch replaces tensorflow.
      python-versions: '["3.11", "3.13"]'
