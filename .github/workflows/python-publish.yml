# Legacy-publisher shim, kept deliberately (see py-canon STANDARD.md).
#
# piedomains' PyPI trusted publisher predates py-canon adoption and is keyed to
# workflow `python-publish.yml` with environment `pypi`. OIDC claims reference
# the workflow *filename*, so publishing has to stay in this file — moving it
# into release.yml would break trusted publishing until the publisher config on
# pypi.org is changed.
#
# Triggered on the tag rather than on `release: published`: releases created by
# the reusable workflow use GITHUB_TOKEN, and GitHub deliberately does not fire
# workflow triggers for events raised by GITHUB_TOKEN, so a `release` trigger
# here would silently never run.
name: python-publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write # trusted publishing (OIDC); no API token
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # uv-dynamic-versioning derives the version from tags

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Publish (trusted publishing, PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          attestations: true
