repos:
  # Kept in step with the ruff version the project and CI resolve to; the old
  # v0.8.5 pin predated adoption and could not parse the current rule selectors.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      # No `exclude` here: tests/ and examples/ are linted too, with the
      # per-file-ignores in pyproject.toml doing the tailoring.
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
