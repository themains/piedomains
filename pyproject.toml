[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "piedomains"
description = "Predict categories based on domain names and their content"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Rajashekar Chintalapati", email = "rajshekar.ch@gmail.com"},
    {name = "Gaurav Sood", email = "gsood07@gmail.com"}
]
keywords = [
    "domain classification",
    "website categorization",
    "machine learning",
    "content analysis",
    "web scraping",
    "computer vision"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Utilities"
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "beautifulsoup4>=4.10.0",
    "playwright>=1.40.0",
    "Pillow>=10.0.0",
    "tqdm>=4.64.0",
    "nltk>=3.8",
    # Inference for the fine-tuned text classifier. torch ships cp314 wheels;
    # tensorflow does not, which is why it is gone.
    "torch>=2.6.0",
    "transformers>=4.48.0",
    "huggingface-hub>=0.23",
    "safetensors>=0.4.5",
    "litellm>=1.55.0",
    "requests>=2.25.0",
    "aiohttp>=3.8.0",
    "protego>=0.3.0",
    "warcio>=1.7.0",
    # CDX + Memento client for archive.org. Deps are only requests + urllib3,
    # both already pulled in above.
    "wayback>=0.5.1",
    # Required by transformers' AutoImageProcessor, which the screenshot path uses.
    # It lived in the `train` group until a clean `pip install piedomains` proved that
    # PEP 735 groups are not installed for ordinary users and classify_by_images() then
    # died with "AutoImageProcessor requires the Torchvision library".
    "torchvision>=0.20",
    # The default extractor (config `extractor`). It powers FineWeb/RefinedWeb and
    # tops the WCXB benchmark. An earlier note here claimed it was worse than the
    # legacy cleaner on our homepages (16/33 pages under the token floor against
    # 14/33); that comparison was invalid -- it measured trafilatura's raw words
    # against legacy's cleaned tokens. Redone properly over 188 pages: 1/188 under
    # the floor against 0/188, while cutting deadspin.com's gambling-ad tokens from
    # 264 to 7.
    "trafilatura>=2.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/themains/piedomains"
Documentation = "https://themains.github.io/piedomains/"
Repository = "https://github.com/themains/piedomains"
Issues = "https://github.com/themains/piedomains/issues"
Changelog = "https://github.com/themains/piedomains/blob/main/CHANGELOG.md"

[project.scripts]
classify_domains = "piedomains.cli:main"

[tool.hatch.build]
exclude = [
    "/.github",
    "/.venv",
    "/docs",
    "/tests",
    "/.gitignore",
    "/.pre-commit-config.yaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/piedomains"]


# Ruff configuration

[tool.hatch.version]
source = "uv-dynamic-versioning"
[tool.ruff]
line-length = 88
target-version = "py311"
# Colab-authored training notebooks; ported to training/ scripts rather than linted.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
external = ["DOC"]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF"]
ignore = ["D203", "D213", "B008", "C901", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Existing suites are unittest-style; PT009/PT027 would be a rewrite, not a fix.
# S108/S103 are fixture temp paths, SIM115/SIM117/RUF059/PT018/S110 test idioms.
"tests/**" = [
    "S101", "D", "PT009", "PT027", "PT018", "T201",
    "S103", "S108", "S110", "S112", "SIM115", "SIM117", "RUF059",
]
"docs/**" = ["D"]
# Demo scripts: printing to stdout is the point, and the "/tmp" literals are
# `docker run --tmpfs` arguments rather than paths this process writes to.
"examples/**" = ["T201", "D", "S101", "S603", "S607", "S108", "RUF059"]
"streamlit/**" = ["T201", "D"]
# Training/eval scripts are CLIs: reporting progress to stdout is their whole purpose.
"src/piedomains/training/**" = ["T201"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "-m",
    "not live and not archive and not ml and not slow",
]
markers = [
    "ml: marks tests that require ML models",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "performance: marks tests that benchmark performance",
    "integration: marks tests that exercise multiple components together",
    "archive: marks tests that hit archive.org",
    "llm: marks tests that exercise the LLM classifier",
    "live: reaches Hugging Face and is deselected by default",
]

# mypy configuration
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# Deptry configuration
[tool.deptry]
extend_exclude = [
    "notebooks",
    "examples",
    "docs",
    "tests",
]
pep621_dev_dependency_groups = ["test", "docs", "dev"]
# Use per-rule ignores for specific dependency issues
[tool.deptry.per_rule_ignores]
DEP004 = ["pytest"]        # Test framework used in tests directory

[tool.deptry.package_module_name_map]
pillow = "PIL"
beautifulsoup4 = "bs4"
scikit-learn = "sklearn"

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"

[tool.preen]
src_layout = true
# Hosts the links check cannot fetch meaningfully. Written without schemes: a
# full URL here is itself extracted and checked, so the note would recreate the
# problem it documents.
#
#   test fixtures  test.org, a.com, b.com, other.com, valid.com, box.local,
#                  secret.onion, custom.url -- invented hosts in tests/, not
#                  links anyone can follow
#   a base URL     raw.githubusercontent.com/Azothyran/ShallalistMirror is
#                  LABEL_MIRROR in training/prepare_text.py, and the code
#                  appends a category path. Bare it 404s; with a path it
#                  answers 200, so the mirror is alive and the finding is not.
#   an outage      index.commoncrawl.org answers 503 today. That is the service
#                  being down, not this repo being wrong.
link_ignore = [
    "test\\.org",
    "//a\\.com",
    "//b\\.com",
    "other\\.com",
    "valid\\.com",
    "box\\.local",
    "secret\\.onion",
    "custom\\.url",
    "facebook\\.com/page",
    "ShallalistMirror",
    "index\\.commoncrawl\\.org",
    "//spaces",
]

[dependency-groups]
# PEP 735 groups, not extras: these are development concerns, and the reusable
# CI wheel job installs `--group test` against the built wheel.
test = [
    "pytest>=8",
    "pytest-cov>=4",
    "pytest-mock>=3.10",
    "pytest-xdist>=3",
    "psutil>=5.9.0",
]
docs = [
    "sphinx>=8",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
]
# Training only. torch/transformers are runtime dependencies now, so this group
# adds just what fine-tuning needs on top of them.
train = [
    "datasets>=2.20",
    "accelerate>=0.34",
    "joblib>=1.2.0",
    "scikit-learn>=1.3.0",
]
dev = [
    { include-group = "test" },
    "ruff>=0.14",
    "pyright>=1.1.390",
    "pydoclint>=0.5",
    "pre-commit>=4",
]

[tool.codespell]
# This package classifies web pages, so its fixtures and docstrings are full of
# text that is not English and not meant to be. Every one of these was checked:
#
#   ist          German -- "seite ist offline", a block-page phrase in blocking.py
#   adresse, ans French -- a docstring example of French page text
#   tabacco      inside a verbatim quotation of Shallalist's own category
#                definition. Correcting it would misquote the source.
#   unparseable  a valid spelling; codespell prefers the other one
ignore-words-list = "ist,adresse,ans,tabacco,unparseable"
# The corpora are domain names and scraped page text, where a "misspelling" is
# usually just a real domain. Auto-correcting one would corrupt training data.
skip = "*.csv,*.parquet,*.joblib,./CHANGELOG.md,uv.lock"
